image: microsoft/dotnet:latest

stages:
  - build
  - test

variables:
  project: "Ryanair.Reservation"
  project_path: "/builds/ryanairLabs/reservation-test"

before_script:
  - "dotnet restore"

build:
  stage: build
  variables:
    build_path: "$project_path/src/$project"
  script:
    - "cd $build_path"
    - "dotnet build"

test:
  stage: test
  variables:
    test_path: "$project_path/test/$project.Tests"
  script:
    - "cd $test_path"
    - "dotnet test"